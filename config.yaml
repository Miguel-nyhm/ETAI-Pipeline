# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text"]  # identifiers / COMPAS's own score, not our model's inputs

# Week 4: the FINAL TEST SET. Carved out once, stratified, and locked: never used to
# fit, tune, compare or choose anything. Do not change these two values after this week --
# a new seed would silently give you a different (already partly "seen") test set.
test_set:
  size: 0.2
  random_state: 42

# Drives clean_dataset (cleaning rules from the Week 3 diagnosis).
diagnostics:
  id_column: "id"
  numeric_text_columns: ["priors_count", "prior_offenses"]   # load as text because of placeholder tokens
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", ""]

  validity_rules:                                             # impossible values -> NaN
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}

  canonical_categories:                                       # spelling variants -> one label; placeholders -> NaN
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"

  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]  # multicollinearity (corr + VIF)

# Week 4: the preprocessing recipe. Rules, not fitted values -- the medians, category
# means and scaling stats are learned again from the training rows of every split.
preprocessing:
  encoder: "target"      # compact (one column per feature) and informative
  scaler: "robust"       # counts have extreme values; median/IQR doesn't let them set the scale
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]   # get a _was_missing flag
  random_state: 42
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

# Week 4: how models are evaluated -- stratified k-fold CV on the development set.
# These are the OUTER folds for nested CV too. Same random_state = same folds every run.
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"
  n_jobs: 1             # -1 = all cores (pays off for slow models, e.g. random forest)

# Week 5: hyperparameter tuning. The tuning code is generic; it reads the search space
# that matches `model.type` below. Keys are Pipeline parameter names (step__param).
# Ensembles take minutes per run: set enabled:false or a small n_trials while testing.
tuning:
  enabled: true
  n_trials: 30
  n_splits: 5          # INNER folds used to score each trial
  random_state: 42     # seeds the sampler and those folds
  search_spaces:
    decision_tree:
      model__max_depth:        {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion:        {type: categorical, choices: ["gini", "entropy"]}
    random_forest:
      model__max_depth:        {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features:     {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    # week 5 (ensembles): the oblique forest tunes its trees (through the Bagging estimator)
    # and how many linear combinations each one splits on; AdaBoost tunes its base-tree depth,
    # the number of rounds and the learning rate.
    oblique_random_forest:
      model__estimator__tree__max_depth:         {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf:  {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components:   {type: int, low: 3, high: 10}   # <= number of features
    adaboost:
      model__estimator__max_depth: {type: int,   low: 1,    high: 8}
      model__n_estimators:         {type: int,   low: 25,   high: 400, log: true}
      model__learning_rate:        {type: float, low: 0.01, high: 1.0, log: true}

# The model main.py runs this time. Switch `type` (and params) to tune a different model;
# compare_models.py tunes several at once into the README comparison table.
model:
  type: "random_forest"
  params: {random_state: 42, n_jobs: -1}
  # type options: dummy | logistic_regression | decision_tree | random_forest |
  #               oblique_random_forest | adaboost
  # examples:
  #   type: "oblique_random_forest"  params: {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  #   type: "adaboost"               params: {max_depth: 1, n_estimators: 200, learning_rate: 1.0, random_state: 42}

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
