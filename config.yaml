# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text"]  # identifiers / COMPAS's own score, not our model's inputs

# Week 4: the FINAL TEST SET. Carved out once, stratified, and locked: never used to
# fit, tune, compare or choose anything. Do not change these two values after this week --
# a new seed would silently give you a different (already partly "seen") test set.
test_set:
  size: 0.2
  random_state: 42

# Drives clean_dataset (cleaning rules from the Week 3 diagnosis).
diagnostics:
  id_column: "id"
  numeric_text_columns: ["priors_count", "prior_offenses"]   # load as text because of placeholder tokens
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", ""]

  validity_rules:                                             # impossible values -> NaN
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}

  canonical_categories:                                       # spelling variants -> one label; placeholders -> NaN
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"

  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]  # multicollinearity (corr + VIF)

# Week 4: the preprocessing recipe. Rules, not fitted values -- the medians, category
# means and scaling stats are learned again from the training rows of every split.
preprocessing:
  encoder: "target"      # compact (one column per feature) and informative
  scaler: "robust"       # counts have extreme values; median/IQR doesn't let them set the scale
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]   # get a _was_missing flag
  random_state: 42
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

# Week 4: how models are evaluated -- stratified k-fold CV on the development set
# (everything except the locked test set). Same random_state = same folds on every
# run, for every model, so comparisons are like-for-like.
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"   # one metric for now, so numbers compare with weeks 2-3
  n_jobs: 1             # -1 = all cores (only pays off for slow models, e.g. random forest)

model:
  type: "random_forest"
  params: {n_estimators: 300, random_state: 42, n_jobs: -1}
    #max_iter: 2000
  # switch `type` (and params) to fill in the README table -- run `python main.py` for each:
  #   type: "dummy"            params: {}
  #   type: "decision_tree"    params: {random_state: 42}
  #   type: "random_forest"    params: {n_estimators: 300, random_state: 42, n_jobs: -1}

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
