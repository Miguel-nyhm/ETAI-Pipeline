# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"
  drop_columns: ["id", "decile_score", "score_text"]

test_set:
  size: 0.2
  random_state: 42

diagnostics:
  id_column: "id"
  numeric_text_columns: ["priors_count", "prior_offenses"]
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", ""]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

preprocessing:
  encoder: "target"
  scaler: "robust"
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  random_state: 42
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

cv:
  n_splits: 5          # OUTER folds for nested CV
  shuffle: true
  random_state: 42
  scoring: "accuracy"
  n_jobs: 1

# Week 5: the model whose hyperparameters matter most -- the decision tree.
model:
  type: "decision_tree"
  params:
    random_state: 42

# Week 5: the tuning search. Keys are Pipeline parameter names (step__param).
tuning:
  n_trials: 30
  n_splits: 5          # INNER folds used to score each trial
  random_state: 42
  search_space:
    model__max_depth:        {type: int, low: 1, high: 25}
    model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
    model__criterion:        {type: categorical, choices: ["gini", "entropy"]}

output:
  results_dir: "results"
